<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>市场营销 · LING CLUB</title>
<style>
:root{--bg:#fbfafa;--card:#fff;--bg2:#f3f1f1;--line:#eae2e2;--tx:#2a2626;--tx2:#6b6060;--tx3:#a89898;--ac:#d63a2e;--r:16px;--shadow:0 4px 20px rgba(160,40,30,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.75}
.app{max-width:680px;margin:0 auto;padding:0 18px 50px}
@media (min-width:768px){.app{max-width:860px}}
.top{position:sticky;top:0;background:rgba(251,250,250,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:9}
.top-in{max-width:680px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
@media (min-width:768px){.top-in{max-width:860px}}
.top a{color:var(--ac);text-decoration:none;font-size:14px}
.top b{font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 10px}
.chip{padding:8px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:13px;color:var(--tx2);cursor:pointer;transition:.15s}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{font-size:16px;color:var(--ac);margin-bottom:8px}
.card .src{font-size:11.5px;color:var(--tx3);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
ul{padding-left:20px;margin:6px 0}
li{margin-bottom:5px;font-size:14.5px}
.kw{color:var(--ac);font-weight:600}
</style>
</head>
<body>
<div class="top"><div class="top-in"><b>市场营销</b><a href="index.html">&larr; 门户</a></div></div>
<div class="app">
<div class="chips" id="chips"></div>
<div id="list"></div>
<div style="margin:26px 0 0" class="card">
<h3 style="font-size:16px;color:var(--ac);margin-bottom:6px">市场营销管理讲义（全文）</h3>
<p style="font-size:13px;color:var(--tx2);margin-bottom:12px">南方科大课程讲义 · 12 章完整内嵌 · 4P/STP/需求管理/渠道/促销全覆盖</p>
<a href="shizi/yingxiao-sustech/index.html" style="display:block;text-align:center;text-decoration:none;padding:13px;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;font-size:15px">打开讲义</a>
</div>
</div>
<script>
/* 数据源：科特勒《营销管理》、吴健安《市场营销学》 */
var CH=[
{id:'ch1',name:'市场营销总论',src:'科特勒《营销管理》第1-2章',items:[
 '核心概念：需要、欲望、需求（有购买力支持的欲望）；<span class="kw">交换是市场营销的核心</span>',
 '市场营销观念演变：生产观念→产品观念→推销观念→<span class="kw">市场营销观念（顾客导向）</span>→社会营销观念',
 '推销观念「以产定销」vs 市场营销观念「以销定产」——出发点、手段、目的都不同',
 '顾客让渡价值=顾客总价值-顾客总成本；顾客满意=感知价值-期望值',
 '关系营销：与关键伙伴建立长期满意关系']},
{id:'ch2',name:'STP 战略',src:'《市场营销学》第6-8章',items:[
 '<span class="kw">S市场细分</span>：地理、人口、心理、行为细分；有效细分标准：可衡量、可进入、可盈利、可行动',
 '<span class="kw">T目标市场</span>：无差异营销、差异营销、集中营销三种策略',
 '目标市场选择五模式：单一集中、选择性专业化、产品专业化、市场专业化、全市场覆盖',
 '<span class="kw">P市场定位</span>：在顾客心中占据独特位置；定位方法：属性/利益/用途/使用者/竞争对比定位',
 '市场领导者策略：扩大总需求、保护份额、扩大份额；追随者：紧密跟随/距离跟随/选择跟随']},
{id:'ch3',name:'产品策略（Product）',src:'《市场营销学》第9-10章',items:[
 '产品整体概念三层次：<span class="kw">核心产品（实质层）、形式产品（有形层）、附加产品（延伸层）</span>',
 '产品组合四度：宽度（产品线数）、长度（品目总数）、深度（每线品种数）、关联度',
 '产品生命周期：<span class="kw">导入期（知、试）、成长期（增、扩）、成熟期（稳、改）、衰退期（转、撤）</span>；各期营销策略重点不同',
 '品牌：品牌与商标的区别；品牌资产；品牌策略——统一品牌/个别品牌/分类品牌/主副品牌',
 '新产品开发八阶段：构思→筛选→概念→商业分析→开发→试销→上市；<span class="kw">新产品采用过程：认识-兴趣-欲望-确信-购买</span>']},
{id:'ch4',name:'定价策略（Price）',src:'《市场营销学》第11章',items:[
 '定价目标：生存、当期利润最大化、市场份额领先、产品质量领先',
 '定价方法三类：<span class="kw">成本导向（成本加成、目标利润）、需求导向（理解价值）、竞争导向（随行就市、投标）</span>',
 '新产品定价：<span class="kw">撇脂定价（高价捞取，适用于高价需求弹性小、受专利保护）vs 渗透定价（低价抢占份额）</span>',
 '心理定价：尾数定价（9.9）、声望定价（整数高位）、招徕定价（特价品）',
 '价格调整：折扣折让（现金/数量/季节/职能折扣）、差别定价、促销定价',
 '需求价格弹性与定价：富有弹性宜降价、缺乏弹性宜提价']},
{id:'ch5',name:'渠道策略（Place）',src:'《市场营销学》第12-13章',items:[
 '分销渠道层级：零级（直销）、一级、二级、三级；消费品 vs 工业品渠道差异',
 '渠道策略：<span class="kw">密集分销、选择分销、独家分销</span>（控制力递增、覆盖面递减）',
 '中间商职能：集散商品、沟通信息、资金融通、承担风险',
 '渠道冲突：水平冲突（同级）、垂直冲突（上下级）；管理通过超级目标与协商',
 '物流（实体分配）：运输、仓储、库存管理；总成本最低权衡']},
{id:'ch6',name:'促销策略（Promotion）',src:'《市场营销学》第14-15章',items:[
 '促销组合四工具：<span class="kw">广告、人员推销、销售促进（SP）、公共关系</span>',
 '推式策略（对渠道商人员推销为主）vs 拉式策略（对消费者广告为主）',
 '广告目标：通知、说服、提醒；AIDA 模式（注意-兴趣-欲望-行动）',
 '人员推销步骤：寻找顾客→事前调查→接近→介绍→处理异议→成交→跟进',
 '销售促进工具：赠品、优惠券、抽奖、折扣、以旧换新；特点<span class="kw">见效快但短期</span>',
 '公共关系：新闻报道、事件营销、企业公益；可信度高、成本低',
 '整合营销传播 IMC：统一形象、协调各传播工具']}
];
var chips=document.getElementById('chips'),list=document.getElementById('list');
CH.forEach(function(c,i){
  var b=document.createElement('button');b.className='chip'+(i===0?' on':'');b.textContent=c.name;
  b.onclick=function(){document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});b.classList.add('on');render(i);location.hash=c.id;};
  chips.appendChild(b);
});
function render(i){
  var c=CH[i],h='';
  c.items.forEach(function(t){h+='<li>'+t+'</li>'});
  list.innerHTML='<div class="card"><h3>'+c.name+'</h3><ul>'+h+'</ul><div class="src">主干教材：'+c.src+'</div></div>';
}
var idx=location.hash?(CH.findIndex(function(c){return location.hash==='#'+c.id})):0;
render(idx<0?0:idx);if(idx>0)chips.children[idx].classList.add('on'),chips.children[0].classList.remove('on');
</script>
</body>
</html>

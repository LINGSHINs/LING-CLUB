<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>市场营销学 · 读书笔记 · LING CLUB</title>
<style>:root{--bg:#fafbfd;--card:#fff;--bg2:#f3f4f8;--line:#e8ebf1;--tx:#232b5c;--tx2:#4b5470;--tx3:#9aa3b8;--ac:#2563eb;--blue:#2563eb;--navy:#1e2a5e;--r:16px;--shadow:0 4px 20px rgba(30,42,94,.07)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;font-size:15.5px;line-height:1.85}
.top{position:sticky;top:0;background:rgba(251,250,250,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:20}
.top-in{max-width:860px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top b{font-size:15px;color:var(--navy)}
.top .crumb{font-size:12px;color:var(--tx3)}
.top a{color:var(--blue);text-decoration:none;font-size:13px;white-space:nowrap}
.wrap{max-width:860px;margin:0 auto;padding:20px 18px 60px}
@media(min-width:768px){.wrap{padding:30px 24px 70px}}
.layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:0;padding:0 18px 60px}
@media(min-width:1080px){.layout{grid-template-columns:230px 1fr;gap:30px;padding:30px 24px 70px}}
.toc{display:none}
@media(min-width:1080px){.toc{display:block;position:sticky;top:70px;align-self:start;max-height:80vh;overflow-y:auto;font-size:12.5px}}
.toc a{display:block;padding:4px 10px;color:var(--tx2);text-decoration:none;border-left:2px solid transparent;border-radius:0 8px 8px 0}
.toc a.l2{padding-left:22px}
.toc a:hover{color:var(--blue);background:#f3f7ff}
.toc a.h1{font-weight:700;color:var(--navy);margin-top:6px}
.doc{background:var(--card);border-radius:var(--r);padding:22px 20px;box-shadow:var(--shadow);min-width:0}
@media(min-width:768px){.doc{padding:34px 38px}}
.doc h1{font-size:23px;color:var(--navy);margin-bottom:16px;letter-spacing:.02em;line-height:1.4}
.doc h2{font-size:19px;color:var(--ac);margin:28px 0 10px;padding-left:10px;border-left:4px solid var(--ac);line-height:1.5}
.doc h3{font-size:16.5px;color:var(--navy);margin:20px 0 8px}
.doc h4{font-size:15px;color:var(--tx);margin:16px 0 6px}
.doc p{margin:8px 0}
.doc ul,.doc ol{padding-left:24px;margin:8px 0}
.doc li{margin:4px 0}
.doc strong{color:var(--navy)}
.doc blockquote{border-left:3px solid var(--blue);background:#f3f7ff;border-radius:0 10px 10px 0;padding:10px 14px;margin:10px 0;color:var(--tx2);font-size:14px}
.doc blockquote p{margin:2px 0}
.doc code{background:var(--bg2);border-radius:6px;padding:1px 6px;font-size:13.5px;color:var(--ac)}
.doc pre{background:#232b5c;color:#e8edf2;border-radius:12px;padding:14px 16px;overflow-x:auto;margin:12px 0}
.doc pre code{background:none;color:inherit;padding:0}
.doc table{border-collapse:collapse;margin:12px auto;width:100%;font-size:13.5px}
.doc th{background:#eaf1fe;color:var(--navy);font-weight:700}
.doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.doc hr{border:none;border-top:1px dashed var(--line);margin:20px 0}
.doc img{max-width:100%;border-radius:10px;margin:8px 0}
/* 索引页 */
.idx a.item{display:block;background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);text-decoration:none;color:var(--tx);transition:.15s;font-size:15px;font-weight:600}
.idx a.item:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(30,42,94,.12);color:var(--ac)}
.idx a.item small{display:block;font-weight:400;font-size:12px;color:var(--tx3);margin-top:2px}

.top{position:sticky;top:0;background:rgba(251,250,250,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:20}
.top-in{max-width:860px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
.top b{font-size:15px;color:var(--navy)}
.top a{color:var(--blue);text-decoration:none;font-size:13px}
.band{max-width:860px;margin:18px auto;padding:0 18px}
</style></head><body>
<div class="top"><div class="top-in"><b>市场营销学 · 读书笔记</b><a href="../../yingxiao.html">&larr; 返回</a></div></div>
<div class="band"><div class="idx" style="padding:0"><a class="item" href="yx-biji.html">市场营销学全篇笔记</a></div></div>
</body></html>

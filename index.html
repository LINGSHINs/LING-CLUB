<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LING CLUB · 学习门户</title>
<style>
:root{
  --bg1:#eef3fb; --bg2:#e8f0fa;
  --blue:#2563eb; --navy:#1e2a5e;
  --skyc:#cdeaf7; --pinkc:#dcebfa; --lilac:#dcebfa;
  --gray:#6b7280; --gray2:#9ca3af;
  --cardsh:0 6px 22px rgba(30,42,94,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 100%);color:var(--navy);
  font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;line-height:1.6;min-height:100vh}
.shell{max-width:1220px;margin:0 auto;padding:22px 18px 50px}
@media (min-width:900px){.shell{padding:36px 28px 60px}}

/* 顶栏: 直接在背景上, 无大板 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;max-width:1220px;margin:0 auto;padding:0 4px 18px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.brand b{font-size:16px;letter-spacing:.05em}
.brand small{display:block;font-size:11px;color:var(--gray);font-weight:400}
.topacts{display:flex;gap:8px}
.iaction{width:38px;height:38px;border-radius:12px;background:#fff;box-shadow:var(--cardsh);display:flex;align-items:center;justify-content:center;color:var(--navy);text-decoration:none;transition:.15s}
.iaction:hover{transform:translateY(-2px)}
.iaction svg{width:18px;height:18px}

/* 主网格: 侧栏窄列 + 内容 + 右栏, 无外层白板 */
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.grid{grid-template-columns:180px 1fr 270px;gap:20px;align-items:start}}

/* 侧栏: 透明列上放白色小卡按钮 */
.sidenav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
@media (min-width:900px){.sidenav{flex-direction:column;position:sticky;top:24px;overflow:visible}}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#fff;box-shadow:var(--cardsh);
  color:var(--gray);font-size:13.5px;font-weight:600;text-decoration:none;white-space:nowrap;transition:.15s}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-item.on{color:var(--blue);background:#eaf1fe}
.nav-item:hover{color:var(--navy);transform:translateY(-2px)}

/* 内容列 */
.main{min-width:0}
.hello{padding:6px 4px 0}
.hello h1{font-size:25px;font-weight:700}
.hello small{display:block;font-size:13px;color:var(--gray);margin-top:4px}
.hello small b{color:var(--blue)}

/* 倒计时: 渐变蓝卡直接在背景上 */
.examcard{margin-top:16px;background:linear-gradient(120deg,var(--blue),#5b8bf7);border-radius:20px;padding:20px 22px;color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(37,99,235,.28)}
.examcard:before{content:"";position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14)}
.examcard b{font-size:16px;display:block}
.examcard p{font-size:11.5px;opacity:.85;margin-top:2px}
.examcard .t{font-size:25px;font-weight:300;font-variant-numeric:tabular-nums}
.examcard .r{position:relative;z-index:1;text-align:right}

.sechead{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 12px}
.sechead h3{font-size:16px;font-weight:700}
.sechead span{font-size:12px;color:var(--gray)}

/* 学科卡: pastel 交替底色 */
.subj-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:560px){.subj-grid{grid-template-columns:1fr 1fr}}
.subject{border-radius:18px;padding:18px 18px 15px;text-decoration:none;color:var(--navy);display:flex;flex-direction:column;gap:6px;transition:.18s;position:relative;overflow:hidden;box-shadow:var(--cardsh)}
.subject:nth-child(4n+1){background:#fff}
.subject:nth-child(4n+2){background:var(--skyc)}
.subject:nth-child(4n+3){background:#fff}
.subject:nth-child(4n+4){background:#eef4fc}
.subject:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(30,42,94,.16)}
.subject .row{display:flex;align-items:center;justify-content:space-between}
.subject .tag{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 10px;letter-spacing:.04em;background:rgba(37,99,235,.12);color:var(--blue);width:max-content}
.subject:nth-child(4n+2) .tag,.subject:nth-child(4n+4) .tag{background:rgba(30,42,94,.1)}
.subject b{font-size:17px}
.subject span{font-size:12px;color:var(--gray);line-height:1.55}
.subject .pct{height:6px;background:rgba(30,42,94,.08);border-radius:99px;overflow:hidden;margin-top:5px}
.subject .pct i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#6b9af8);border-radius:99px}
.subject .pt{font-size:11px;color:var(--gray)}
.subject .geo{position:absolute;right:-16px;bottom:-16px;width:64px;height:64px;border-radius:50%;border:2.5px solid rgba(37,99,235,.14)}
.subject:nth-child(4n+3) .geo{border-color:rgba(30,42,94,.08)}

/* 右栏 */
.right{display:flex;flex-direction:column;gap:12px}
@media (max-width:899px){.right{margin-top:6px}}
.user{background:#fff;border-radius:16px;box-shadow:var(--cardsh);padding:14px;display:flex;align-items:center;gap:10px}
.user .av{width:38px;height:38px;border-radius:50%;background:#dcebfa;display:flex;align-items:center;justify-content:center;font-weight:700}
.user b{font-size:14px;display:block;line-height:1.2}
.user span{font-size:11px;color:var(--gray)}
.stat2x2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcard{border-radius:16px;padding:13px;font-size:12px;line-height:1.45;position:relative;overflow:hidden;box-shadow:var(--cardsh)}
.fcard b{font-size:14.5px;display:block;margin-bottom:2px}
.fcard span{opacity:.75;font-size:11px}
.fcard .geo{position:absolute;right:-12px;bottom:-12px;width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.fcard.navy{background:var(--navy);color:#fff}
.fcard.white{background:#fff;color:var(--navy)}
.fcard.pink{background:#eef4fc;color:var(--navy)}
.fcard.sky{background:var(--skyc);color:var(--navy)}
.fcard.navy .geo{border-color:rgba(255,255,255,.35)}
.fcard.sky .geo{border-color:rgba(255,255,255,.6)}
@media (min-width:900px){.right{position:sticky;top:24px}}
.plan{background:#fff;border-radius:16px;box-shadow:var(--cardsh);padding:14px;font-size:12.5px;color:var(--gray)}
.plan b{color:var(--navy);display:block;font-size:13px;margin-bottom:4px}
.plan a{color:var(--blue);text-decoration:underline;text-underline-offset:3px;font-size:12px}
</style>
<style>.srch{margin-top:14px;display:flex;gap:8px}
.srch input{flex:1;padding:12px 16px;border:1px solid var(--line);border-radius:14px;font-size:14px;background:#fff;box-shadow:var(--cardsh);outline:none;color:var(--navy);font-family:inherit}
.srch input:focus{border-color:var(--blue)}
.sres{background:#fff;border-radius:16px;box-shadow:var(--cardsh);margin-top:10px;overflow:hidden;display:none}
.sres a{display:block;padding:11px 16px;font-size:13.5px;color:var(--navy);text-decoration:none;border-bottom:1px solid var(--bg2)}
.sres a:last-child{border:none}
.sres a small{color:var(--blue);margin-right:8px;font-size:11px}</style></head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="brand">
      <div class="logo">LC</div>
      <div><b>LING CLUB</b><small>个人学习门户 · 2027 备考</small></div>
    </div>
    <div class="topacts">
      <a class="iaction" href="#subjects" title="学科"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V10M9 19V5M14 19v-8M19 19V8"/></svg></a>
      <a class="iaction" href="shizi/" title="讲义库"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"/><path d="M9 7h7M9 11h7"/></svg></a>
    </div>
  </div>

  <div class="grid">

    <aside class="sidenav">
      <a class="nav-item on" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>总览</a>
      <a class="nav-item" href="jinrong.html">金融学</a>
      <a class="nav-item" href="kuaiji.html">会计</a>
      <a class="nav-item" href="jingji.html">经济学</a>
      <a class="nav-item" href="falv.html">法律基础</a>
      <a class="nav-item" href="wenmi.html">文秘基础</a>
      <a class="nav-item" href="tongyong.html">通用能力</a>
      <a class="nav-item" href="yingxiao.html">市场营销</a>
    </aside>

    <main class="main">
      <div class="hello">
        <h1>你好，LING</h1>
        <small>备考进行中 · <b id="cdDays">待定</b> 天后考试（2027 年，时间待定）</small>
      </div>

      <div class="srch"><input id="sq" placeholder="搜索 201 篇讲义与笔记…" autocomplete="off"><div class="sres" id="sr"></div></div>
<div class="examcard" id="exam">
        <div><b>考试倒计时</b><p>时间确定后自动开始精确倒计时</p></div>
        <div class="r"><div class="t" id="cdText">时间待定</div></div>
      </div>

      <div class="sechead" id="subjects">
        <h3>学科</h3>
        <span>7 科 · 按分值排序</span>
      </div>
      <div class="subj-grid" id="grid"></div>
    </main>

    <aside class="right">
      <div class="user">
        <div class="av">L</div>
        <div><b>LING</b><span>study plan · 2027</span></div>
      </div>
      <div class="stat2x2">
        <div class="fcard navy"><b>金融 39.5</b><span>占比最大 · 主攻</span><i class="geo"></i></div>
        <div class="fcard white"><b>会计 14</b><span>30 章详解已上线</span></div>
        <div class="fcard pink"><b>行测 9</b><span>58 篇专项详解</span></div>
        <div class="fcard sky"><b>法律 10.5</b><span>民法 25 篇详解</span><i class="geo"></i></div>
      </div>
      <div class="plan">
        <b>学习方式</b>
        每科 = 教材主干 + 讲义/笔记内嵌阅读页；后续上传的讲义持续归入对应科目。
        <a>材料直接发群里即可</a>
      </div>
    </aside>

  </div>
</div>
<script>
var SUBJECTS=[
 {id:'jinrong',  name:'金融学',    tag:'39.5 分', desc:'主干 + 图谱40概念 + 笔记 + 财管14篇详解', pct:100},
 {id:'kuaiji',   name:'会计',      tag:'14 分',   desc:'基础会计主干 + 注会30章详解（基础+进阶）', pct:100},
 {id:'jingji',   name:'经济学',    tag:'10.5 分', desc:'主干 + 管理经济学全解 + 读书笔记六篇', pct:100},
 {id:'falv',     name:'法律基础',  tag:'10.5 分', desc:'主干 + 民法25篇 + 注会经济法24篇 + 劳动法3篇', pct:100},
 {id:'wenmi',    name:'文秘基础',  tag:'10.5 分', desc:'主干 + 公文三件套 + 管理学要点', pct:100},
 {id:'tongyong', name:'通用能力',  tag:'9 分',    desc:'数量/资料/言语/判断 58 篇专项详解 + 必背手册', pct:100},
 {id:'yingxiao', name:'市场营销',  tag:'6 分',    desc:'主干 + 讲义全文 + 营销学笔记', pct:100}
];
var g=document.getElementById('grid');
SUBJECTS.forEach(function(s){
  var a=document.createElement('a');
  a.className='subject';a.href=s.id+'.html';
  a.innerHTML='<div class="row"><span class="tag">'+s.tag+'</span></div><b>'+s.name+'</b><span>'+s.desc+'</span>'+
    '<div class="pct"><i style="width:'+s.pct+'%"></i></div><div class="pt">内容完成度 '+s.pct+'%</div><i class="geo"></i>';
  g.appendChild(a);
});
/* EXAM_DATE 确定后填 'YYYY-MM-DDTHH:MM:SS+08:00'；null=未定 */
var EXAM_DATE=null;
function cd(){
  var el=document.getElementById('cdText'),d=document.getElementById('cdDays');
  if(!EXAM_DATE){el.textContent='时间待定';d.textContent='待定';return}
  var t=new Date(EXAM_DATE)-new Date();
  if(t<=0){el.textContent='已开考';d.textContent='0';return}
  var dd=Math.floor(t/86400000),hh=Math.floor(t%86400000/3600000),mm=Math.floor(t%3600000/60000);
  el.textContent=dd+' 天 '+(hh<10?'0':'')+hh+' 时 '+(mm<10?'0':'')+mm+' 分';
  d.textContent=dd;
}
cd();setInterval(cd,60000);
var ART=[];var XR=new XMLHttpRequest();
XR.open('GET','articles.json');XR.onload=function(){try{ART=JSON.parse(XR.responseText);var si=document.getElementById('sq');si.placeholder='搜索 '+ART.length+' 篇讲义与笔记…'}catch(e){}};
XR.send();
var srEl=document.getElementById('sr'),sqEl=document.getElementById('sq');
sqEl.addEventListener('input',function(){
  var q=this.value.trim().toLowerCase();
  if(!q){srEl.style.display='none';srEl.innerHTML='';return}
  var hits=ART.filter(function(a){return (a.t+a.c).toLowerCase().indexOf(q)>-1}).slice(0,8);
  srEl.innerHTML=hits.map(function(a){return '<a href="shizi/'+a.u+'"><small>'+a.c+'</small>'+a.t+'</a>'}).join('')||'<a>无匹配</a>';
  srEl.style.display='block';
});
document.addEventListener('click',function(e){if(!srEl.contains(e.target)&&e.target!==sqEl)srEl.style.display='none'});
</script>
</body>
</html>
